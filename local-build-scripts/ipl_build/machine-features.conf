# IPL options for build_ipl.sh.
# Uncomment a line to enable an option, comment it out to disable it.
#
#   RZ_SRAM_REGION_ACCESS  TF-A: ENABLE_SRAM_REGION_ACCESS_MCPU=1 (MCPU SRAM access from Linux)
#   RZ_REMOTEPROC          no effect on the IPL; set enable_overlay_remoteproc=1 in
#                          boot/uEnv.txt (kernel rzv2h-rdk-remoteproc.dtbo)
#   RZ_CM33_COLDBOOT       TF-A: ENABLE_RZV2H_CM33_BOOT=1; on xSPI, BL2 at 0x100000 and FIP at 0x280000
#   RZ_CM33_FIRMWARE_LOAD  TF-A: ENABLE_CM33_FIRMWARE_LOAD=1; BL2 loads the CM33 firmware
#                          written on xSPI at 0x202000 (xSPI boot only)
#   RZ_CA55_CPU_CLOCKUP    TF-A: ENABLE_CA55_CLOCKUP=1 (CA55 1.8GHz, needs kernel 1.8GHz OPP)
#
# Supported combinations:
#   remoteproc (default)          RZ_SRAM_REGION_ACCESS RZ_REMOTEPROC
#   CM33/CR8 from U-Boot          RZ_SRAM_REGION_ACCESS
#   CA55 cold boot, CA55 1.8GHz   RZ_CM33_FIRMWARE_LOAD RZ_CA55_CPU_CLOCKUP
#   CM33 cold boot                RZ_CM33_COLDBOOT
#
MACHINE_FEATURES:append = " RZ_SRAM_REGION_ACCESS"
MACHINE_FEATURES:append = " RZ_REMOTEPROC"
#MACHINE_FEATURES:append = " RZ_CM33_COLDBOOT"
#MACHINE_FEATURES:append = " RZ_CM33_FIRMWARE_LOAD"
#MACHINE_FEATURES:append = " RZ_CA55_CPU_CLOCKUP"
